<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在线客服工作台 · 清大华宇AI</title>
<style>
  :root{--accent:#2563eb;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
  button,input,textarea{font:inherit}
  .login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:10}
  .login form{background:#fff;padding:28px;border-radius:16px;box-shadow:0 20px 50px rgba(15,23,42,.12);width:340px;max-width:calc(100vw - 32px)}
  .login h1{margin:0 0 4px;font-size:18px}
  .login p{margin:0 0 18px;color:var(--muted);font-size:13px}
  .login input{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;outline:none}
  .login input:focus{border-color:var(--accent)}
  .login button{width:100%;margin-top:12px;padding:11px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
  .login small{display:block;margin-top:10px;min-height:16px;color:#dc2626}
  .app{display:none;height:100%;grid-template-columns:300px 1fr}
  .app.ready{display:grid}
  .side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .side header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .side h2{margin:0;font-size:15px;flex:1}
  .side header button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:12.5px}
  .filters{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .filters button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 0;cursor:pointer;color:var(--muted);font-size:12.5px}
  .filters button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .list{overflow-y:auto;flex:1;min-height:0}
  .item{padding:11px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer;display:flex;flex-direction:column;gap:3px}
  .item:hover{background:#f8fafc}
  .item.on{background:#eff6ff;box-shadow:inset 3px 0 0 var(--accent)}
  .item .row{display:flex;align-items:center;gap:6px}
  .item .who{font-weight:600;font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .when{font-size:11px;color:var(--muted);flex:none}
  .item .snip{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{background:#ef4444;color:#fff;border-radius:999px;font-size:11px;padding:0 6px;min-width:18px;text-align:center;line-height:18px}
  .live{width:7px;height:7px;border-radius:50%;background:#cbd5e1;flex:none}
  .live.on{background:#22c55e}
  .empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px}
  .main{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
  .main header{background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .main header h3{margin:0;font-size:15px}
  .main header .sub{color:var(--muted);font-size:12px}
  .main header .spacer{flex:1}
  .main header a{color:var(--accent);font-size:12.5px;text-decoration:none}
  .main header button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12.5px;color:var(--ink)}
  .main header button:hover{border-color:#94a3b8}
  .log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;min-height:0}
  .msg{max-width:70%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word;font-size:13.5px}
  .msg.visitor{align-self:flex-start;background:#fff;border:1px solid var(--line)}
  .msg.agent{align-self:flex-end;background:var(--accent);color:#fff}
  .msg.ai{align-self:flex-start;background:#eef2ff;border:1px solid #c7d2fe;color:#312e81}
  .msg.ai .tag{display:block;font-size:11px;opacity:.7;margin-bottom:2px}
  .msg.system{align-self:center;background:#e2e8f0;color:#475569;font-size:12px;max-width:80%;text-align:center}
  .item .flag{font-size:11px;color:#b45309;background:#fef3c7;border-radius:4px;padding:0 5px;flex:none}
  .item .ai{font-size:11px;color:#4338ca;background:#e0e7ff;border-radius:4px;padding:0 5px;flex:none}
  .stamp{align-self:center;font-size:11px;color:#94a3b8}
  .compose{border-top:1px solid var(--line);background:#fff;padding:12px;display:flex;gap:10px;align-items:flex-end}
  .compose textarea{flex:1;resize:none;height:64px;max-height:180px;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;outline:none}
  .compose textarea:focus{border-color:var(--accent)}
  .compose button{border:0;background:var(--accent);color:#fff;padding:11px 20px;border-radius:10px;cursor:pointer}
  .compose button:disabled{opacity:.5;cursor:default}
  .hint{padding:40px;text-align:center;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:9px 16px;border-radius:999px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
  @media(max-width:860px){.app.ready{grid-template-columns:1fr}.side{display:none}.app.showlist .side{display:flex}.app.showlist .main{display:none}}
</style>
</head>
<body>
<div class="login" id="login">
  <form id="loginForm">
    <h1>客服工作台</h1>
    <p>清大华宇AI · lanhc.com 在线客服</p>
    <input type="password" name="password" placeholder="访问口令" autocomplete="current-password" required>
    <button type="submit">进入</button>
    <small id="loginMsg"></small>
  </form>
</div>

<div class="app" id="app">
  <aside class="side">
    <header>
      <span class="live on"></span>
      <h2>会话</h2>
      <button type="button" id="reload">刷新</button>
      <button type="button" id="logout">退出</button>
    </header>
    <div class="filters">
      <button type="button" class="on" data-all="0">待处理</button>
      <button type="button" data-all="1">全部</button>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main class="main">
    <header>
      <h3 id="peer">请选择左侧会话</h3>
      <span class="sub" id="peerSub"></span>
      <span class="spacer"></span>
      <button type="button" id="toggleList" style="display:none">会话列表</button>
      <button type="button" id="closeSession" style="display:none">结束会话</button>
    </header>
    <div class="log" id="log"><div class="hint">选择会话后开始回复访客留言。</div></div>
    <form class="compose" id="compose" style="display:none">
      <textarea id="replyText" placeholder="输入回复，Enter 发送，Shift+Enter 换行" maxlength="2000"></textarea>
      <button type="submit" id="replyBtn">发送</button>
    </form>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var token = "";
  var sessions = [];
  var current = null;
  var lastID = 0;
  var showAll = false;
  var timer = null;
  var waitingCapture = false;

  function toast(text) {
    var el = $("toast");
    el.textContent = text;
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove("show"); }, 2200);
  }

  function api(path, opts) {
    opts = opts || {};
    return fetch(path, {
      method: opts.method || "GET",
      headers: opts.body ? { "Content-Type": "application/json" } : undefined,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      credentials: "same-origin",
    }).then(function (res) {
      if (res.status === 401 && path.indexOf("/login") < 0) {
        showLogin();
        throw new Error("unauthorized");
      }
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) throw new Error(data.error || res.status);
        return data;
      });
    });
  }

  function showLogin() {
    $("app").classList.remove("ready");
    $("login").style.display = "flex";
  }

  function showApp() {
    $("login").style.display = "none";
    $("app").classList.add("ready");
  }

  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var pass = $("loginForm").querySelector("input").value;
    $("loginMsg").textContent = "";
    api("/chat/api/admin/login", { method: "POST", body: { password: pass } })
      .then(function () {
        showApp();
        loadSessions();
        start();
      })
      .catch(function (err) { $("loginMsg").textContent = "登录失败：" + err.message; });
  });

  $("logout").addEventListener("click", function () {
    api("/chat/api/admin/logout", { method: "POST" }).finally(showLogin);
  });

  $("reload").addEventListener("click", loadSessions);

  $("toggleList").addEventListener("click", function () {
    $("app").classList.toggle("showlist");
  });

  Array.prototype.forEach.call(document.querySelectorAll(".filters button"), function (btn) {
    btn.addEventListener("click", function () {
      showAll = btn.dataset.all === "1";
      Array.prototype.forEach.call(document.querySelectorAll(".filters button"), function (b) {
        b.classList.toggle("on", b === btn);
      });
      loadSessions();
    });
  });

  function fmtTime(ts) {
    var d = new Date(ts * 1000);
    var now = new Date();
    var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
    if (d.toDateString() === now.toDateString()) return pad(d.getHours()) + ":" + pad(d.getMinutes());
    return (d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function renderList() {
    var list = $("list");
    list.innerHTML = "";
    if (!sessions.length) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = showAll ? "暂无会话" : "没有待处理的会话";
      list.appendChild(empty);
      return;
    }
    sessions.forEach(function (s) {
      var item = document.createElement("div");
      item.className = "item" + (current === s.id ? " on" : "");
      var who = s.name ? s.name + (s.email ? " · " + s.email : "") : (s.email || "访客 " + s.id.slice(0, 6));
      var live = Date.now() / 1000 - s.last_seen < 120;
      item.innerHTML =
        "<div class='row'><span class='live" + (live ? " on" : "") + "'></span>" +
        "<span class='who'></span>" +
        (s.need_human ? "<span class='flag'>待人工</span>" : "") +
        (s.ai_replies ? "<span class='ai'>AI " + s.ai_replies + "</span>" : "") +
        (s.unread ? "<span class='badge'>" + s.unread + "</span>" : "") +
        "<span class='when'>" + fmtTime(s.last_visitor) + "</span></div>" +
        "<div class='snip'></div>";
      item.querySelector(".who").textContent = who;
      item.querySelector(".snip").textContent = s.last || "（无消息）";
      item.addEventListener("click", function () { openSession(s.id); });
      list.appendChild(item);
    });
  }

  function loadSessions() {
    return api("/chat/api/admin/sessions?all=" + (showAll ? "1" : "0"))
      .then(function (data) {
        sessions = data.sessions || [];
        renderList();
      })
      .catch(function () {});
  }

  function openSession(id) {
    current = id;
    lastID = 0;
    $("log").innerHTML = "";
    $("compose").style.display = "flex";
    $("closeSession").style.display = "inline-block";
    $("app").classList.remove("showlist");
    var s = sessions.filter(function (x) { return x.id === id; })[0];
    updateHeader(s);
    loadMessages();
    renderList();
  }

  function updateHeader(s) {
    if (!s) return;
    $("peer").textContent = s.name || ("访客 " + s.id.slice(0, 8));
    var bits = [];
    if (s.email) bits.push(s.email);
    if (s.page) {
      try { bits.push(new URL(s.page).pathname); } catch (e) { bits.push(s.page); }
    }
    if (s.ip) bits.push(s.ip);
    $("peerSub").textContent = bits.join(" · ");
    $("closeSession").textContent = s.closed ? "重新打开" : "结束会话";
  }

  function renderMessages(msgs) {
    var log = $("log");
    (msgs || []).forEach(function (m) {
      if (m.id <= lastID) return;
      lastID = m.id;
      var div = document.createElement("div");
      var role = m.role === "visitor" ? "visitor" : m.role === "agent" ? "agent" : m.role === "ai" ? "ai" : "system";
      div.className = "msg " + role;
      if (role === "ai") {
        var tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = "AI 自动回复";
        div.appendChild(tag);
        div.appendChild(document.createTextNode(m.text));
      } else {
        div.textContent = m.text;
      }
      log.appendChild(div);
    });
    log.scrollTop = log.scrollHeight;
  }

  function loadMessages() {
    if (!current) return Promise.resolve();
    return api("/chat/api/admin/messages?id=" + encodeURIComponent(current) + "&since=" + lastID)
      .then(function (data) {
        renderMessages(data.messages);
        var s = sessions.filter(function (x) { return x.id === current; })[0];
        if (s) { s.last_seen = data.session.last_seen; updateHeader(Object.assign({}, s, data.session)); }
        loadSessions();
      })
      .catch(function () {});
  }

  $("compose").addEventListener("submit", function (e) {
    e.preventDefault();
    var box = $("replyText");
    var text = box.value.trim();
    if (!text || !current) return;
    $("replyBtn").disabled = true;
    api("/chat/api/admin/reply", { method: "POST", body: { id: current, text: text } })
      .then(function (data) {
        box.value = "";
        renderMessages([data.message]);
        loadSessions();
      })
      .catch(function (err) { toast("发送失败：" + err.message); })
      .finally(function () { $("replyBtn").disabled = false; });
  });

  $("replyText").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      $("compose").requestSubmit ? $("compose").requestSubmit() : $("compose").dispatchEvent(new Event("submit", { cancelable: true }));
    }
  });

  $("closeSession").addEventListener("click", function () {
    if (!current) return;
    var s = sessions.filter(function (x) { return x.id === current; })[0];
    var next = !(s && s.closed);
    api("/chat/api/admin/close", { method: "POST", body: { id: current, closed: next } })
      .then(function () { toast(next ? "会话已结束" : "会话已重新打开"); loadSessions(); })
      .catch(function (err) { toast(err.message); });
  });

  function tick() {
    if (!current) return loadSessions();
    loadMessages();
  }

  function start() {
    if (timer) clearInterval(timer);
    timer = setInterval(tick, 3500);
  }

  // Resume an existing cookie session without asking for the password again.
  api("/chat/api/admin/sessions?all=0")
    .then(function () { showApp(); loadSessions(); start(); })
    .catch(function () { showLogin(); });
})();
</script>
</body>
</html>
